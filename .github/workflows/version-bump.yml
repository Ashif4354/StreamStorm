name: Update Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (X.X.X or vX.X.X)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-version:
    name: Update Versions and Commit to Master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate version input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.X.X or vX.X.X (for example, 4.2.1)."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Update project versions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make update-versions VERSION="$VERSION"

      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No version changes to commit. The version may already be set."
            exit 1
          fi
          git commit -m "Release v$VERSION [skip ci]"
          git push origin HEAD:master
